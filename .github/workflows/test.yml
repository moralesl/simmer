# Both suites, hermetic: SIMMER_FAKE_* substitutes every power read, the
# switch is a file, the clock is SIMMER_FAKE_NOW; no sudo, nothing touched on
# the runner.
#
# Two OS versions, because the platform floor is macOS 14 and simmer reads the
# machine by parsing `pmset` and `sysadminctl` output — text that is free to
# change between releases. A green run on the newest macOS says nothing about
# the oldest one simmer claims to support.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is the declared floor (Package.swift), macos-15 the one
        # most contributors are actually on.
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build (release, all products)
        run: swift build -c release

      - name: Unit + acceptance suites
        run: make test

      - name: Bundle assembles and signs ad-hoc
        run: make app

      - name: Templates and installer parse
        run: |
          plutil -lint launchd/guard.plist.template app/Info.plist.template
          bash -n bootstrap.sh
