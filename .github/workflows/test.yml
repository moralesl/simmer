# v1 — the Swift package — builds and its two suites pass. Hermetic:
# SIMMER_FAKE_* substitutes every power read, the switch is a file, the clock
# is SIMMER_FAKE_NOW; no sudo, nothing touched on the runner.
#
# The v0.1 bash spike left the working tree on 2026-08-23 and lives at the
# git tag `v0.1`, so there is nothing archived left to guard here.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  v1:
    # macOS because the whole tool is macOS power management.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (release, all products)
        run: swift build -c release

      - name: Unit + acceptance suites
        run: make test

      - name: Bundle assembles and signs ad-hoc
        run: make app

      - name: Templates parse
        run: |
          plutil -lint launchd/guard.plist.template app/Info.plist.template
          bash -n bootstrap.sh
