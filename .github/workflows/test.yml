# Both suites, hermetic: SIMMER_FAKE_* substitutes every power read, the
# switch is a file, the clock is SIMMER_FAKE_NOW; no sudo, nothing touched on
# the runner.
#
# Two OS versions, because the platform floor is macOS 14 and simmer reads the
# machine by parsing `pmset` and `sysadminctl` output — text that is free to
# change between releases. A green run on the newest macOS says nothing about
# the oldest one simmer claims to support.
#
# The OS varies; the toolchain does not. Swift 6 is a real requirement of this
# package (`swift-tools-version: 6.0`) and every leg selects a toolchain that
# has it — see the Toolchain step.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Callable, so `release.yml` can gate a tag on THESE legs rather than on a
  # second copy of them. Two lists of checks drift, and the one that would
  # drift is the one nobody watches until a release goes out red.
  workflow_call:

jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is the declared floor (Package.swift), macos-15 the one
        # most contributors are actually on.
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # The matrix varies the OS on purpose — it must not vary the compiler as
      # well. `macos-14` ships several Xcodes and *defaults* to 15.4, whose
      # Swift 5.10 cannot even parse `swift-tools-version: 6.0`, so the floor
      # leg failed at manifest load while `macos-15` went green: the one leg
      # that exists to test the oldest supported OS was testing nothing.
      # Select the newest toolchain the image carries, on every leg, so the
      # only difference between them is the thing being tested.
      - name: Toolchain
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          swift --version
          # Assert the floor rather than trust the image: when a runner update
          # drops the toolchain the manifest needs, this must say so here and
          # not as a manifest parse error three steps later.
          major="$(swift -version 2>&1 | sed -n 's/.*Swift version \([0-9]*\).*/\1/p' | head -1)"
          [ "${major:-0}" -ge 6 ] || {
            echo "::error::Package.swift needs Swift 6; this image offers ${major:-unknown}"
            exit 1
          }

      - name: Build (release, all products)
        run: swift build -c release

      - name: Unit + acceptance suites
        run: make test

      - name: Bundle assembles and signs ad-hoc
        run: make app

      - name: Templates and installer parse
        run: |
          plutil -lint launchd/guard.plist.template app/Info.plist.template
          bash -n bootstrap.sh

  # The Raycast extension is the one part of this repository that is not Swift,
  # so it gets its own leg rather than a step inside a macOS one.
  #
  # Ubuntu on purpose, and it decides what this leg can honestly claim. The `ray`
  # CLI is macOS-only and talks to a locally installed Raycast, so `ray lint` and
  # `ray build` cannot run here at all — they are local steps, documented in
  # integrations/raycast/README.md. What DOES run is platform-independent and is
  # the part that breaks silently: the typecheck, ESLint, and the two test
  # suites.
  #
  # The contract suite (tests/bridge.test.mts) needs the built binary and skips
  # itself without one, so on this leg it is the pure units that run. That is
  # deliberate rather than an oversight: the same file runs for real on macOS in
  # the `raycast-contract` leg below, where a binary exists.
  raycast-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/raycast
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: integrations/raycast/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npx eslint src tests

      - name: Pure units
        run: npm test

  # The half of the extension's suite that is worth running against a real
  # binary: `tests/bridge.test.mts` drives the BUILT simmer through its own seam,
  # so a renamed JSON field or a changed exit code fails here rather than showing
  # up as an empty list in Raycast. It is the acceptance suite's idea, from the
  # other side of the pipe.
  #
  # It skips itself when simmer is absent, so the build step below is what makes
  # this leg mean anything — an absent binary must fail here, not silently pass.
  raycast-contract:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: integrations/raycast/package-lock.json

      - name: Toolchain
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          swift --version

      - name: Build simmer
        run: swift build -c release

      - name: Contract suite against the built binary
        working-directory: integrations/raycast
        run: |
          npm ci
          # Absent binary must fail, not skip: the suite skips itself politely on
          # a user's machine, and that politeness would make this leg a no-op.
          bin="$GITHUB_WORKSPACE/.build/release/simmer"
          [ -x "$bin" ] || { echo "::error::$bin was not built"; exit 1; }
          SIMMER_BIN="$bin" npm test

  # `bootstrap.sh` is the highest-consequence file in the repository: it is
  # piped from curl into bash and it writes to /etc/sudoers.d. It was also the
  # only one with no static analysis — `bash -n` above answers "does this
  # parse", never "does an unquoted path break on a home directory with a
  # space in it".
  #
  # Linux on purpose: shellcheck is preinstalled there and the analysis is
  # platform-independent, so this costs seconds instead of a brew install on
  # each macOS leg. The macOS-only checks (`plutil`) stay where they are.
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: |
          # Absent tool fails rather than skips — same reason as the CLT leg.
          command -v shellcheck >/dev/null || {
            echo "::error::shellcheck is not on this image; the installer would go unchecked"
            exit 1
          }
          shellcheck --version
          # Default severity, deliberately: it is where the correctness checks
          # live (quoting, unset variables, misused tests) and bootstrap.sh is
          # clean against it today, so this is a ratchet for the next edit.
          # `--enable=all` adds only preference checks — brace style, [[ ]] over
          # [ ] — which would mean rewriting every line of a working installer
          # for no change in what it does.
          shellcheck bootstrap.sh

  # The one-paste install, actually run.
  #
  # `bootstrap.sh` is the path every colleague takes and the one `simmer update`
  # points them back to, and until now CI only asked whether it PARSES. Nothing
  # executed it: not the clone, not `make install`, not the write to
  # /etc/sudoers.d that SECURITY.md's central promise is about, not the guard
  # registration. A runner is the right place for that — it is a machine nobody
  # minds, granted for twenty minutes.
  #
  # Against THIS checkout, never the published tag: `SIMMER_REPO` points at the
  # workspace and `SIMMER_REF` at a branch created here, so the leg tests the
  # commit under review rather than the last release.
  #
  # `SIMMER_NO_LAUNCH=1` is the one step a runner cannot stand in for. Opening
  # the app is how the notification permission gets requested, and that is a
  # click by design (PLATFORM-FACTS.md) — so the leg installs everything and
  # asserts everything else, and says here that the banner is not covered.
  one-paste-install:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          swift --version

      # The installer clones by ref, and `git clone --branch` does not take a
      # SHA — on a pull request the checkout is a detached HEAD, so give it a
      # name to ask for.
      - name: Name the commit under test
        run: git switch -c ci-under-test

      - name: The documented one-paste install, start to finish
        env:
          SIMMER_REPO: ${{ github.workspace }}
          SIMMER_REF: ci-under-test
          SIMMER_NO_LAUNCH: "1"
        run: |
          SIMMER_DIR="$RUNNER_TEMP/simmer-src" bash bootstrap.sh

      # Every promise the installer's own epilogue makes, asserted. A leg that
      # ran the script and checked nothing would go green on an installer that
      # printed its way to the end having installed half of it.
      - name: Assert what it promised
        run: |
          fail() { echo "::error::$1"; exit 1; }

          bin="$HOME/.local/bin/simmer"
          [ -L "$bin" ] || fail "$bin is not the symlink make install writes"
          "$bin" --version || fail "the installed CLI does not run"

          app="$HOME/Applications/Simmer.app"
          [ -x "$app/Contents/MacOS/simmer-app" ] || fail "no app executable in the bundle"
          [ "$(readlink "$bin")" = "$app/Contents/MacOS/simmer" ] ||
            fail "the CLI is not the binary inside the bundle — they can now drift"

          # The privileged step, which is the whole reason the guard can hand
          # the switch back unattended. Scoped exactly as SECURITY.md states.
          rule="/etc/sudoers.d/simmer-$(id -un)"
          [ -f "$rule" ] || fail "$rule was not installed"
          sudo -nl | grep -qE 'NOPASSWD:.*/usr/bin/pmset -a disablesleep 0' ||
            fail "the rule is there but grants nothing"

          # The watchdog. `make install` bootstraps it into the GUI domain, and
          # whether launchd allows that on a runner is something only this leg
          # can answer — if it cannot, that is a real fact about the
          # environment and belongs in the log, not behind a skip.
          launchctl print "gui/$(id -u)/io.github.moralesl.simmer.guard" >/dev/null ||
            fail "the guard is not loaded"

          # And simmer's own verdict on the install it just got. `doctor` exits
          # 1 here by design — nothing opened the app, so the rows about
          # banners are red — so this reads the two rows the INSTALLER is
          # responsible for rather than the exit code.
          "$bin" doctor --json > "$RUNNER_TEMP/doctor.json" || true
          for key in guard_loaded sudo_rule; do
            verdict="$(jq -r --arg k "$key" \
              '.checks[] | select(.id == $k) | .ok' "$RUNNER_TEMP/doctor.json")"
            [ "$verdict" = "true" ] || fail "doctor says $key is ${verdict:-absent}"
          done
          echo "doctor agrees: guard loaded, sudo rule in place"

      - name: And uninstall says how to undo all of it
        run: $HOME/.local/bin/simmer uninstall

  # The toolchain the whole build is designed around, and the one CI never
  # used. "CLT-only by design: the bundle is hand-assembled and ad-hoc signed,
  # never xcodebuild" (Makefile) exists because colleagues' machines have at
  # best the Command Line Tools — but runners ship full Xcode, so the
  # `CLT_FRAMEWORKS` branch that makes `swift test` find Testing.framework
  # there had never once executed. Every green run was evidence about a
  # toolchain no user of this tool is required to have.
  #
  # One OS is enough: the variable here is the toolchain, and the matrix above
  # already covers the OS.
  command-line-tools:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select the Command Line Tools
        run: |
          # Absent CLT must fail, not skip. A leg that quietly becomes a no-op
          # when an image changes is worse than no leg: it keeps reporting
          # green about something it stopped testing.
          if [ ! -d /Library/Developer/CommandLineTools ]; then
            echo "::error::this image no longer ships /Library/Developer/CommandLineTools — the CLT-only path is now untested, which the Makefile's central claim depends on"
            exit 1
          fi
          sudo xcode-select -s /Library/Developer/CommandLineTools
          xcode-select -p
          swift --version
          # A CLT older than Swift 6 is real information, not a CI problem: it
          # means a colleague on this OS with only the Command Line Tools
          # cannot build simmer, which is what the README promises they can.
          major="$(swift -version 2>&1 | sed -n 's/.*Swift version \([0-9]*\).*/\1/p' | head -1)"
          [ "${major:-0}" -ge 6 ] || {
            echo "::error::the Command Line Tools here offer Swift ${major:-unknown}; Package.swift needs 6 — bootstrap.sh must say so before the compiler does"
            exit 1
          }

      - name: Build, both suites, and the bundle — no Xcode
        run: |
          swift build -c release
          make test
          make app
